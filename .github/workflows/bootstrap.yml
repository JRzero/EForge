name: bootstrap-and-verify

on:
  push:
    branches: ['feat/foundation-v0.1']

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Expand EForge source
        run: |
          cat .bootstrap/parts/part-* | base64 -d | tar -xzf -
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ci.yml')
          s = p.read_text()
          s = s.replace("      - uses: pnpm/action-setup@v4\n        with:\n          version: 10\n", "      - uses: pnpm/action-setup@v4\n")
          p.write_text(s)
          p = Path('packages/core/src/http.test.ts')
          s = p.read_text()
          s = s.replace("    await expect(client.get('/me')).rejects.toEqual(expect.objectContaining<HttpError>({status: 401}));", "    await expect(client.get('/me')).rejects.toBeInstanceOf(HttpError);")
          p.write_text(s)
          PY
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser verification
        run: pnpm test:e2e

      - name: Commit verified foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build EForge enterprise frontend foundation v0.1"
          git push
